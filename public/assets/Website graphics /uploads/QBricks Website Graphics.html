  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r(--ink-900);\n  --surface-raised:  var(--white);\n  --surface-overlay: rgba(10, 10, 13, 0.55);\n\n  /* Text */\n  --text-primary:   var(--ink-950);\n  --text-secondary: var(--ink-600);\n  --text-muted:     var(--ink-400);\n  --text-inverse:   var(--white);\n  --text-on-accent: var(--white);\n  --text-link:      var(--red-600);\n\n  /* Accent */\n  --accent:         var(--red-500);\n  --accent-hover:   var(--red-600);\n  --accent-press:   var(--red-700);\n  --accent-subtle:  var(--red-50);\n  --accent-border:  var(--red-200);\n\n  /* Borders */\n  --border-subtle:  var(--ink-100);\n  --border-default: var(--ink-200);\n  --border-strong:  var(--ink-300);\n  --border-inverse: rgba(255, 255, 255, 0.12);\n\n  /* Feedback */\n  --success:   var(--green-500);\n  --success-bg: var(--green-50);\n  --warning:   var(--amber-500);\n  --warning-bg: var(--amber-50);\n  --danger:    var(--red-600);\n  --danger-bg: var(--red-50);\n  --info:      var(--blue-500);\n  --info-bg:   var(--blue-50);\n\n  /* Focus */\n  --focus-ring: var(--red-500);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   QBricks — Typography tokens\n   Display: Poppins (geometric, logo-matched)\n   Body:    Manrope\n   Mono:    JetBrains Mono (data contracts, code, metrics)\n   ============================================================ */\n:root {\n  /* Families */\n  --font-display: 'Poppins', system-ui, sans-serif;\n  --font-body:    'Manrope', system-ui, sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, monospace;\n\n  /* Weights */\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n  --weight-extrabold: 800;\n\n  /* Type scale (1.250 major-third-ish, tuned) */\n  --text-xs:   12px;\n  --text-sm:   14px;\n  --text-base: 16px;\n  --text-md:   18px;\n  --text-lg:   20px;\n  --text-xl:   24px;\n  --text-2xl:  30px;\n  --text-3xl:  38px;\n  --text-4xl:  48px;\n  --text-5xl:  60px;\n  --text-6xl /* ============================================================\n     Semantic aliases\n     ============================================================ */\n  /* Surfaces */\n  --bg-base:         var(--white);\n  --bg-subtle:       var(--ink-50);\n  --bg-inverse:      var(--ink-950);\n  --surface-card:    var(--white);\n  --surface-card-inverse: var(--ink-900);\n  --surface-raised:  var(--white);\n  --surface-overlay: rgba(10, 10, 13, 0.55);\n\n  /* Text */\n  --text-primary:   var(--ink-950);\n  --text-secondary: var(--ink-600);\n  --text-muted:     var(--ink-400);\n  --text-inverse:   var(--white);\n  --text-on-accent: var(--white);\n  --text-link:      var(--red-600);\n\n  /* Accent */\n  --accent:         var(--red-500);\n  --accent-hover:   var(--red-600);\n  --accent-press:   var(--red-700);\n  --accent-subtle:  var(--red-50);\n  --accent-border:  var(--red-200);\n\n  /* Borders */\n  --border-subtle:  var(--ink-100);\n  --border-default: var(--ink-200);\n  --border-strong:  var(--ink-300);\n  --border-inverse: rgba(255, 255, 255, 0.12);\n\n  /* Feedback */\n  --success:   var(--green-500);\n  --success-bg: var(--green-50);\n  --warning:   var(--amber-500);\n  --warning-bg: var(--amber-50);\n  --danger:    var(--red-600);\n  --danger-bg: var(--red-50);\n  --info:      var(--blue-500);\n  --info-bg:   var(--blue-50);\n\n  /* Focus */\n  --focus-ring: var(--red-500);\n}\n\n/* ============================================================\n   QBricks — Typography tokens\n   Display: Poppins (geometric, logo-matched)\n   Body:    Manrope\n   Mono:    JetBrains Mono (data contracts, code, metrics)\n   ============================================================ */\n:root {\n  /* Families */\n  --font-display: 'Poppins', system-ui, sans-serif;\n  --font-body:    'Manrope', system-ui, sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, monospace;\n\n  /* Weights */\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n  --weight-extrabold: 800;\n\n  /* Type scale (1.250 major-third-ish, tuned) */\n  --text-xs:   12px;\n  --text-sm:   14px;\n  --text-base: 16px;\n  --text-md:   18px;\n  --text-lg:   20px;\n  --text-xl:   24px;\n  --text-2xl:  30px;\n  --text-3xl:  38px;\n  --text-4xl:  48px;\n  --text-5xl:  60px;\n  --text-6xl:  76px;\n\n  /* Line heights */\n  --leading-tight:   1.05;\n  --leading-snug:    1.2;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* Letter spacing */\n  --tracking-tighter: -0.03em;\n  --tracking-tight:   -0.015em;\n  --tracking-normal:  0;\n  --tracking-wide:    0.02em;\n  --tracking-caps:    0.08em; /* uppercase eyebrows / labels */\n\n  /* Semantic roles */\n  --font-heading: var(--font-display);\n  --eyebrow-size: var(--text-sm);\n}\n\n/* ============================================================\n   QBricks — Spacing, radii, shadows, motion\n   Base unit: 4px\n   ============================================================ */\n:root {\n  /* Spacing scale */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* Radii — gently rounded, echoing the rounded logo letterforms */\n  --radius-xs:   4px;\n  --radius-sm:   6px;\n  --radius-md:   10px;\n  --radius-lg:   16px;\n  --radius-xl:   24px;\n  --radius-2xl:  32px;\n  --radius-pill: 999px;\n  --radius-full: 9999px;\n\n  /* Shadows — soft, neutral, low-spread (enterprise-clean) */\n  --shadow-xs: 0 1px 2px rgba(10, 10, 13, 0.06);\n  --shadow-sm: 0 1px 3px rgba(10, 10, 13, 0.08), 0 1px 2px rgba(10, 10, 13, 0.04);\n  --shadow-md: 0 4px 12px rgba(10, 10, 13, 0.08), 0 2px 4px rgba(10, 10, 13, 0.04);\n  --shadow-lg: 0 12px 28px rgba(10, 10, 13, 0.12), 0 4px 8px rgba(10, 10, 13, 0.05);\n  --shadow-xl: 0 24px 56px rgba(10, 10, 13, 0.16);\n <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <!-- alerts -->\n              <div style=\"grid-column:1 / -1;border:1px solid rgba(255,255,255,0.10);border-radius:12px;background:rgba(255,255,255,0.02);padding:14px 24px;display:flex;flex-direction:column;justify-content:center\">\n                <sc-for list=\"{{alerts}}\" as=\"al\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.06)\">\n                    <div style=\"width:9px;height:9px;border-radius:50%;background:{{al.c}};box-shadow:0 0 12px {{al.g}};flex:none\"><\u002Fdiv>\n                    <div style=\"height:7px;border-radius:4px;background:rgba(255,255,255,0.20);width:{{al.b1}}px\"><\u002Fdiv>\n                    <div style=\"height:7px;border-radius:4px;background:rgba(255,255,255,0.09);flex:1\"><\u002Fdiv>\n                    <div style=\"height:7px;border-radius:4px;background:rgba(255,255,255,0.13);width:{{al.b2}}px;flex:none\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- floating foreground panel -->\n        <div style=\"position:absolute;left:700px;top:920px;width:900px;height:320px;transform:translateZ(120px);border-radius:14px;border:1px solid rgba(255,255,255,0.13);background:linear-gradient(200deg, rgba(36,36,46,0.6), rgba(16,16,22,0.5));backdrop-filter:blur(2px);padding:20px 24px;overflow:hidden\">\n          <div style=\"display:flex;gap:12px;margin-bottom:16px\">\n            <div style=\"height:8px;width:120px;border-radius:4px;background:rgba(255,255,255,0.30)\"><\u002Fdiv>\n            <div style=\"height:8px;width:60px;border-radius:4px;background:rgba(255,29,37,0.55)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{tableRows}}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.06)\">\n              <div style=\"width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.20)\"><\u002Fdiv>\n              <div style=\"height:7px;border-radius:4px;background:rgba(255,255,255,0.17);width:{{r.b2}}px\"><\u002Fdiv>\n              <div style=\"height:7px;border-radius:4px;background:rgba(255,255,255,0.09);width:{{r.b1}}px\"><\u002Fdiv>\n              <div style=\"height:7px;border-radius:4px;background:rgba(255,255,255,0.09);width:{{r.b3}}px\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <div style=\"position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(rgba(6,6,8,0), rgba(6,6,8,0.85))\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: &quot;4140&quot;, &quot;height&quot;: &quot;1260&quot; },\n  &quot;showBricks&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Background&quot; },\n  &quot;showGrid&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Background&quot; },\n  &quot;glowIntensity&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 60, &quot;min&quot;: 0, &quot;max&quot;: 100, &quot;step&quot;: 5, &quot;unit&quot;: &quot;%&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Background&quot; }\n}\">\nclass Component extends DCLogic {\n  renderVals() {\n    let seed = 987654321;\n    const rnd = () => {\n      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;\n      return seed / 4294967296;\n    };\n    const glow = Math.max(0, Math.min(1, (this.props.glowIntensity ?? 60) / 100));\n\n    const makeCubes = (fromLeft) => {\n      const out = [];\n      for (let i = 0; i < 56; i++) {\n        const t = rnd();\n        let x = Math.round(-30 + Math.pow(t, 1.7) * 720 + rnd() * 90);\n        if (!fromLeft) x = 1920 - 22 - x;\n        out.push({\n          x, y: Math.round(rnd() * 1050),\n          sc: (0.35 + rnd() * 1.15).toFixed(2),\n          op: Math.max(0.1, (1 - t * 0.8) * (0.3 + rnd() * 0.7)).toFixed(2)\n        });\n      }\n      for (let i = 0; i < 12; i++) {\n        let x = Math.round(820 + rnd() * 1050);\n        if (!fromLeft) x = 1920 - 22 - x;\n        out.push({ x, y: Math.round(rnd() * 1050), sc: (0.3 + rnd() * 0.6).toFixed(2), op: (0.08 + rnd() * 0.18).toFixed(2) });\n      }\n      return out;\n    };\n    const cubes = makeCubes(true);\n    const cubesB = makeCubes(false);\n\n    const hub = { x: 430, y: 274 };\n    const raw = [\n      [150, 90, '#FF1D25'], [305, 38, '#8A8A96'], [520, 55, '#FF1D25'], [676, 120, '#3B82F6'],\n      [722, 268, '#22A06B'], [652, 408, '#E8960C'], [505, 478, '#FF1D25'], [330, 492, '#3B82F6'],\n      [172, 428, '#FF1D25'], [108, 296, '#22A06B'], [205, 172, '#E8960C'], [566, 196, '#8A8A96']\n    ];\n    const glowFor = (c) =>\n      c === '#FF1D25' ? 'rgba(255,29,37,0.55)' :\n      c === '#22A06B' ? 'rgba(34,160,107,0.5)' :\n      c === '#E8960C' ? 'rgba(232,150,12,0.5)' :\n      c === '#3B82F6' ? 'rgba(59,130,246,0.5)' : 'rgba(170,170,185,0.35)';\n    const nodes = raw.map(([cx, cy, c]) => ({\n      x: cx - 16, y: cy - 16, c, g: glowFor(c),\n      l1: Math.round(34 + rnd() * 32), l2: Math.round(20 + rnd() * 24)\n    }));\n    const edges = raw.concat([[492, 352, '']]).map(([cx, cy]) => {\n      const dx = cx - hub.x, dy = cy - hub.y;\n      return { x: hub.x, y: hub.y, len: Math.round(Math.hypot(dx, dy)), ang: (Math.atan2(dy, dx) * 180 / Math.PI).toFixed(1) };\n    });\n\n    const bars = (n, lo, hi) => Array.from({ length: n }, () => ({\n      b1: Math.round(lo + rnd() * (hi - lo)),\n      b2: Math.round(lo * 0.6 + rnd() * (hi - lo) * 0.7),\n      b3: Math.round(lo * 0.5 + rnd() * (hi - lo) * 0.5)\n    }));\n\n    const entities = [\n      { w: '73%', c: '#E8960C' }, { w: '68%', c: '#E8960C' }, { w: '66%', c: '#E8960C' },\n      { w: '55%', c: '#FF1D25' }, { w: '67%', c: '#E8960C' }\n    ].map(e => ({ ...e, gl: glowFor(e.c) }));\n\n    const alerts = ['#FF1D25', '#FF1D25', '#FF1D25', '#E8960C', '#E8960C'].map(c => ({\n      c, g: glowFor(c), b1: Math.round(200 + rnd() * 240), b2: Math.round(60 + rnd() * 60)\n    }));\n\n    return {\n      showBricks: this.props.showBricks ?? true,\n      showGrid: this.props.showGrid ?? true,\n      glowOp: glow.toFixed(2),\n      cubes, cubesB, nodes, edges,\n      rowsA: bars(11, 90, 250), rowsB: bars(9, 70, 200), rowsC: bars(12, 80, 220),\n      rowsD: bars(7, 60, 170), rowsE: bars(10, 80, 210), rowsF: bars(6, 70, 180),\n      tableRows: bars(8, 120, 290),\n      entities, alerts\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
